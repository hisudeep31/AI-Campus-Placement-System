version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: placement_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    container_name: placement_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # environment:
    #   ANTHROPIC_API_KEY: your_key_here   # optional, enables LLM-based interview questions

  server:
    build: ./server
    container_name: placement_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/placement_db
      JWT_SECRET: change_this_to_a_long_random_string
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      LOG_LEVEL: info
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:5173
      # CHANGE THESE before any real deployment — the server prints a loud
      # warning on boot if left at these defaults.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin123!
      # Optional: set these to send real emails. Without them, emails are
      # logged as a dry run and NOT sent.
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: 587
      # SMTP_USER: you@example.com
      # SMTP_PASSWORD: app_password
      # SMTP_FROM: "Campus Placement Cell <no-reply@example.com>"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - server_uploads:/app/uploads

volumes:
  pgdata:
  server_uploads:
